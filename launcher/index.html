<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Minecraft Star Launcher</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="../node_modules/particles.js/particles.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gradient-to-br from-black via-purple-900/20 to-indigo-900/20 overflow-hidden">
  <!-- Stars background -->
  <div id="particles-js" class="fixed inset-0 z-0"></div>
  
  <!-- Main UI -->
  <div class="relative z-10 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-black/50 backdrop-blur-md p-6 text-white text-2xl font-bold flex items-center space-x-4">
      <div class="w-12 h-12 bg-gradient-to-r from-yellow-400 to-orange-500 rounded-xl animate-pulse"></div>
      <h1>Minecraft Star Launcher 🚀</h1>
    </header>
    
    <!-- Content -->
    <main class="flex-1 p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Login Panel -->
      <div class="lg:col-span-1 bg-black/30 backdrop-blur-md rounded-2xl p-8 border border-white/20">
        <h2 class="text-xl mb-6">Login</h2>
        <select id="authMode" class="w-full bg-black/50 border-white/30 p-3 rounded-xl mb-4 text-white">
          <option value="online">Online</option>
          <option value="offline">Offline</option>
          <option value="cracked">Cracked</option>
        </select>
        <input id="username" type="text" placeholder="Username" class="w-full bg-black/50 border-white/30 p-3 rounded-xl mb-4 text-white">
        <button id="loginBtn" class="w-full bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 p-3 rounded-xl font-bold transition-all duration-300">Login</button>
      </div>
      
      <!-- Mods Panel -->
      <div class="lg:col-span-1 bg-black/30 backdrop-blur-md rounded-2xl p-8 border border-white/20">
        <h2 class="text-xl mb-6">Mods</h2>
        <button class="mod-btn w-full bg-green-500/70 hover:bg-green-600 p-3 rounded-xl mb-3 font-bold transition-all" data-mod="lunar">Lunar Client</button>
        <button class="mod-btn w-full bg-orange-500/70 hover:bg-orange-600 p-3 rounded-xl mb-3 font-bold transition-all" data-mod="badlion">Badlion Client</button>
        <button class="mod-btn w-full bg-purple-500/70 hover:bg-purple-600 p-3 rounded-xl mb-3 font-bold transition-all" data-mod="feather">Feather Client</button>
        <div id="modStatus" class="mt-4 text-sm opacity-75"></div>
      </div>
      
      <!-- Servers & Play Panel -->
      <div class="lg:col-span-1 bg-black/30 backdrop-blur-md rounded-2xl p-8 border border-white/20">
        <h2 class="text-xl mb-6">Servers</h2>
        <button id="newServer" class="w-full bg-indigo-500/70 hover:bg-indigo-600 p-3 rounded-xl mb-4 font-bold transition-all">New Server</button>
        <div id="serverStatus" class="mb-6 text-sm opacity-75">No server running</div>
        
        <button id="playBtn" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 p-4 rounded-2xl font-bold text-lg shadow-2xl hover:shadow-glow transition-all duration-500" disabled>
          PLAY ⭐
        </button>
      </div>
    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
